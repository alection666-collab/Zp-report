<style>
:root{--bg:#eef0ee;--sf:#fff;--tx:#1b2422;--mu:#6b7774;--ln:#d9dedc;--ac:#0f6b63;--ac2:#e0f0ed;--dg:#b4402f;--tot:#16302c;--tt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--sf:#1b2321;--tx:#e8eeec;--mu:#8d9a96;--ln:#2d3835;--ac:#4fc3b6;--ac2:#1d3330;--dg:#e5806f;--tot:#4fc3b6;--tt:#0d1b19}}
:root[data-theme="dark"]{--bg:#121816;--sf:#1b2321;--tx:#e8eeec;--mu:#8d9a96;--ln:#2d3835;--ac:#4fc3b6;--ac2:#1d3330;--dg:#e5806f;--tot:#4fc3b6;--tt:#0d1b19}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Manrope","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:6px 0 12px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;margin:0;font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;min-width:0;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.r{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.amt{width:84px;flex:none;text-align:right}
.chips{display:flex;gap:4px;margin-bottom:8px}
.chip{flex:1;padding:11px 0;border:1px solid var(--ln);background:var(--bg);color:var(--mu);border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--tt)}
.chip.dz{flex:1.6}
button{font:inherit;cursor:pointer}
.x{border:0;background:none;color:var(--mu);font-size:24px;line-height:1;padding:4px 8px;flex:none}
.add{width:100%;border:1px dashed var(--ac);background:var(--ac2);color:var(--ac);border-radius:10px;padding:11px;font-weight:700}
.sub{color:var(--mu);font-size:13px;text-align:right;margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.lb{font-size:13px;color:var(--mu);margin:0 0 4px}
.hint{font-size:13px;color:var(--mu);margin:2px 2px 8px}
.mh{font-weight:800;margin:0 2px 8px}
.wk,.wr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wr{margin-bottom:5px}
.wk span{font-size:12px;color:var(--mu);text-align:center;padding-bottom:2px}
.dy{aspect-ratio:1/1.08;border:1px solid var(--ln);background:var(--bg);border-radius:10px;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:16px;padding:0;min-width:0}
.dy small{font-size:11px;font-weight:700;color:var(--ac)}
.dy.has{background:var(--ac2);border-color:var(--ac)}
.dy.td{box-shadow:inset 0 0 0 2px var(--mu)}
.dy.off{opacity:.22;pointer-events:none}
.sum{background:var(--tot);color:var(--tt);border-radius:16px;padding:16px;margin-bottom:12px}
.sum .row{display:flex;justify-content:space-between;padding:4px 0;opacity:.9}
.sum .big{display:block;font-size:32px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.sum .per{font-size:14px;opacity:.8;margin-bottom:6px}
.btns{display:flex;gap:8px}
.btns button,.pri{flex:1;padding:13px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:var(--tt);font-weight:700}
.btns button.sec2{background:none;color:var(--ac);border-color:var(--ln);font-size:14px}
.btns button.sec{background:none;color:var(--dg);border-color:var(--ln)}
.pri{width:100%;margin-top:10px}
pre{white-space:pre-wrap;word-break:break-word;font:14px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;margin:8px 0 0}
details summary{font-weight:700;cursor:pointer}
.ok{color:var(--ac);font-size:14px;margin-top:6px;min-height:20px}
#sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.ent{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.dl{background:none;border:0;color:var(--dg);font-size:14px;padding:6px 0 0}
</style>
</head>
<body>
<main>
<h1>Отчёт для зарплаты</h1>

<div class="card">
  <div class="g2" style="margin-bottom:0">
    <div><p class="lb">Период с</p><input type="date" data-p="from"></div>
    <div><p class="lb">по</p><input type="date" data-p="to"></div>
  </div>
</div>

<div class="card"><details><summary>Ставки (автосумма)</summary>
  <div class="g2" style="margin:10px 0 0">
   <div><p class="lb">М — монтаж</p><input type="number" inputmode="numeric" data-p="rates.М"></div>
   <div><p class="lb">П — пультовая</p><input type="number" inputmode="numeric" data-p="rates.П"></div>
   <div><p class="lb">Д — демонтаж</p><input type="number" inputmode="numeric" data-p="rates.Д"></div>
   <div><p class="lb">Деж — дежурный</p><input type="number" inputmode="numeric" data-p="rates.Деж"></div>
  </div></details></div>

<p class="hint">Нажмите на число, чтобы заполнить день.</p>
<div id="cal"></div>

<div id="trips"></div>
<button class="add" data-a="addTrip" style="margin-bottom:12px">+ Командировка</button>

<div class="card">
  <div class="hd"><h2>Прочие расходы</h2></div>
  <div id="exps"></div>
  <button class="add" data-a="addExp">+ Расход</button>
  <div class="sub" id="expSub"></div>
</div>

<div class="card">
  <div class="hd"><h2>Долг</h2></div>
  <input type="number" inputmode="numeric" placeholder="0" data-p="debt">
</div>

<div class="sum" id="sum"></div>

<div class="btns">
  <button data-a="copy">Скопировать отчёт</button>
  <button class="sec" data-a="reset">Новый период</button>
</div>
<div class="btns" style="margin-top:8px">
  <button class="sec2" data-a="export">Сохранить копию в файл</button>
  <button class="sec2" data-a="import">Восстановить из файла</button>
</div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<div class="ok" id="ok"></div>
<div class="card" style="margin-top:6px"><details><summary>Текст отчёта</summary><pre id="rep"></pre></details></div>
</main>

<datalist id="evnames"></datalist>

<div id="sheet" role="dialog" aria-modal="true">
  <div class="sh">
    <div class="hd"><h2 id="shT"></h2><button class="x" data-a="close" aria-label="Закрыть">×</button></div>
    <div id="shB"></div>
    <button class="add" data-a="addEntry">+ Ещё площадка в этот день</button>
    <button class="pri" data-a="close">Готово</button>
  </div>
</div>

<script>
var KEY="zp_report_v1";
var CODES=["М","П","Д","Деж"];
var MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
var S,cur=null;
function $(id){return document.getElementById(id)}
function iso(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function fmt(n){return Math.round(n).toLocaleString("ru-RU")}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function dd(s,short){if(!s)return"";var p=s.split("-");return p[2]+"."+p[1]+"."+(short?p[0].slice(2):p[0])}
function defRates(){return{"М":5000,"П":15000,"Д":5000,"Деж":10000}}
function defPeriod(){var d=new Date(),y=d.getFullYear(),m=d.getMonth();return d.getDate()<=15?{from:iso(new Date(y,m,1)),to:iso(new Date(y,m,15))}:{from:iso(new Date(y,m,16)),to:iso(new Date(y,m+1,0))}}
function fresh(){var p=defPeriod();return{from:p.from,to:p.to,days:[],trips:[],exps:[],debt:"",rates:defRates()}}
function fix(o){
 o.rates=o.rates||defRates();o.trips=o.trips||[];o.exps=o.exps||[];o.days=o.days||[];
 if(o.events){o.events.forEach(function(e){e.rows.forEach(function(r){if(!r.a&&!(r.c&&r.c.length)&&!r.e)return;o.days.push({d:r.d||o.from,name:e.name||"",c:r.c||[],a:r.a||"",e:r.e||"",m:!!r.m})})});delete o.events}
 return o}
function load(){try{var v=localStorage.getItem(KEY);if(v)return fix(JSON.parse(v))}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function auto(r){return r.c.reduce(function(s,k){return s+num(S.rates[k])},0)}
function codeStr(c){var s="";CODES.forEach(function(k){if(c.indexOf(k)>-1)s+=k});return s}
function inP(d){return d>=S.from&&d<=S.to}
function emptyE(e){return !e.c.length&&!num(e.a)&&!num(e.e)}
function tripSum(t){return num(t.a)+num(t.pd)*num(t.days)}
function dayEntries(d){var r=[];S.days.forEach(function(e,i){if(e.d===d)r.push(i)});return r}
function totals(){
 var w=0,x=0;
 S.days.forEach(function(e){if(inP(e.d)){w+=num(e.a);x+=num(e.e)}});
 S.trips.forEach(function(t){w+=tripSum(t)});
 S.exps.forEach(function(e){x+=num(e.a)});
 var d=num(S.debt);return{w:w,x:x,d:d,t:w+x+d}}

/* ---- история названий ---- */
function hist(){try{return JSON.parse(localStorage.getItem("zp_names")||"[]")}catch(e){return[]}}
function addHist(n){n=(n||"").trim();if(!n)return;var h=hist().filter(function(x){return x!==n});h.unshift(n);try{localStorage.setItem("zp_names",JSON.stringify(h.slice(0,40)))}catch(e){}fillList()}
function fillList(){var o="";hist().forEach(function(n){o+='<option value="'+esc(n)+'">'});$("evnames").innerHTML=o}
function lastName(d){var b=null;S.days.forEach(function(e){if(e.name&&e.d<=d&&(!b||e.d>=b.d))b=e});return b?b.name:""}

/* ---- календарь ---- */
function kfmt(n){return n>=1000?(Math.round(n/100)/10).toString().replace(".",",")+"к":(n>0?String(n):"•")}
function renderCal(){
 var f=S.from,t=S.to,h="";
 if(!f||!t||f>t){$("cal").innerHTML='<div class="card">Выберите период</div>';return}
 var a=pd(f),b=pd(t),m=new Date(a.getFullYear(),a.getMonth(),1),td=iso();
 while(m<=b){
  var y=m.getFullYear(),mo=m.getMonth(),n=new Date(y,mo+1,0).getDate(),off=(new Date(y,mo,1).getDay()+6)%7,cells=[],i;
  for(i=0;i<off;i++)cells.push(0);for(i=1;i<=n;i++)cells.push(i);while(cells.length%7)cells.push(0);
  h+='<div class="card"><div class="mh">'+MONTHS[mo]+' '+y+'</div><div class="wk">'+WD.map(function(w){return"<span>"+w+"</span>"}).join("")+'</div>';
  for(var w=0;w<cells.length;w+=7){
   var row=cells.slice(w,w+7);
   if(!row.some(function(dn){return dn&&inP(iso(new Date(y,mo,dn)))}))continue;
   h+='<div class="wr">';
   row.forEach(function(dn){
    if(!dn){h+="<div></div>";return}
    var d=iso(new Date(y,mo,dn)),sum=0,has=false;
    dayEntries(d).forEach(function(k){var e=S.days[k];if(!emptyE(e)){has=true;sum+=num(e.a)}});
    h+='<button class="dy'+(inP(d)?"":" off")+(has?" has":"")+(d===td?" td":"")+'" data-a="openDay" data-d="'+d+'"><span>'+dn+'</span>'+(has?"<small>"+kfmt(sum)+"</small>":"")+'</button>'});
   h+="</div>"}
  h+="</div>";m=new Date(y,mo+1,1)}
 $("cal").innerHTML=h}

/* ---- окно дня ---- */
function renderSheet(){
 var d=pd(cur),h="",tot=0;
 $("shT").textContent=d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",weekday:"long"});
 dayEntries(cur).forEach(function(i){
  var e=S.days[i],pf="days."+i+".";tot+=num(e.a);
  h+='<div class="ent"><p class="lb">Площадка</p><input list="evnames" placeholder="Название — впишите любое" value="'+esc(e.name)+'" data-p="'+pf+'name" style="margin-bottom:10px"><div class="chips">';
  CODES.forEach(function(k){h+='<button class="chip'+(k==="Деж"?" dz":"")+(e.c.indexOf(k)>-1?" on":"")+'" data-a="chip" data-i="'+i+'" data-k="'+k+'">'+k+'</button>'});
  h+='</div><div class="g2" style="margin-bottom:0"><div><p class="lb">Сумма за день</p><input type="number" inputmode="numeric" placeholder="0" value="'+esc(e.a)+'" data-p="'+pf+'a"></div><div><p class="lb">Расходы за день</p><input type="number" inputmode="numeric" placeholder="0" value="'+esc(e.e)+'" data-p="'+pf+'e"></div></div><button class="dl" data-a="delEntry" data-i="'+i+'">Удалить запись</button></div>'});
 $("shB").innerHTML=h}
function openDay(d){
 cur=d;
 if(!dayEntries(d).length)S.days.push({d:d,name:lastName(d),c:[],a:"",e:"",m:false});
 renderSheet();$("sheet").classList.add("open");document.body.classList.add("lock");
 try{history.pushState({s:1},"")}catch(e){}}
function doClose(){
 S.days=S.days.filter(function(e){return !emptyE(e)});
 cur=null;$("sheet").classList.remove("open");document.body.classList.remove("lock");
 renderCal();calc()}
function closeBtn(){if(history.state&&history.state.s){history.back()}else if(cur)doClose()}
window.addEventListener("popstate",function(){if(cur)doClose()});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&cur)closeBtn()});

/* ---- командировки и расходы ---- */
function renderTrips(){
 var h="";
 S.trips.forEach(function(t,i){var p="trips."+i+".";
  h+='<div class="card"><div class="hd"><h2>Командировка</h2><button class="x" data-a="delTrip" data-i="'+i+'" aria-label="Удалить">×</button></div>'+
  '<div class="g2"><div><p class="lb">Город</p><input value="'+esc(t.city)+'" placeholder="Питер" data-p="'+p+'city"></div><div><p class="lb">Даты</p><input value="'+esc(t.dates)+'" placeholder="14-15" data-p="'+p+'dates"></div></div>'+
  '<div class="g2"><div><p class="lb">Оплата</p><input type="number" inputmode="numeric" value="'+esc(t.a)+'" data-p="'+p+'a"></div><div></div></div>'+
  '<div class="g2"><div><p class="lb">Суточные в день</p><input type="number" inputmode="numeric" value="'+esc(t.pd)+'" data-p="'+p+'pd"></div><div><p class="lb">Дней</p><input type="number" inputmode="numeric" value="'+esc(t.days)+'" data-p="'+p+'days"></div></div>'+
  '<div class="sub" data-sub="t'+i+'"></div></div>'});
 $("trips").innerHTML=h}
function renderExps(){
 var h="";
 S.exps.forEach(function(e,i){var p="exps."+i+".";
  h+='<div class="r"><input style="width:84px;flex:none" placeholder="дата" value="'+esc(e.d)+'" data-p="'+p+'d"><input placeholder="Билеты, такси…" value="'+esc(e.t)+'" data-p="'+p+'t"><input class="amt" type="number" inputmode="numeric" placeholder="сумма" value="'+esc(e.a)+'" data-p="'+p+'a"><button class="x" data-a="delExp" data-i="'+i+'" aria-label="Удалить">×</button></div>'});
 $("exps").innerHTML=h}

/* ---- итоги и отчёт ---- */
function calc(){
 S.trips.forEach(function(t,i){var el=document.querySelector('[data-sub="t'+i+'"]');if(el)el.textContent="Итого: "+fmt(tripSum(t))+" ₽"});
 var T=totals();
 $("expSub").textContent=S.exps.length?"Прочие расходы: "+fmt(S.exps.reduce(function(s,e){return s+num(e.a)},0))+" ₽":"";
 $("sum").innerHTML='<div class="per">Период: '+(dd(S.from,1)||"…")+' – '+(dd(S.to,1)||"…")+'</div>'+
  '<div class="row"><span>Работа</span><b>'+fmt(T.w)+'</b></div><div class="row"><span>Расходы</span><b>'+fmt(T.x)+'</b></div><div class="row"><span>Долг</span><b>'+fmt(T.d)+'</b></div>'+
  '<div class="row" style="border-top:1px solid rgba(255,255,255,.25);margin-top:6px;padding-top:10px"><span>Мне должны</span></div><span class="big">'+fmt(T.t)+' ₽</span>';
 $("rep").textContent=report();
 renderCal();save()}
function report(){
 var T=totals(),o=[],g={},order=[];
 o.push("Период: "+dd(S.from,1)+" – "+dd(S.to,1));o.push("");
 S.days.map(function(e,x){return{e:e,x:x}}).filter(function(it){return inP(it.e.d)&&(it.e.c.length||num(it.e.a))})
  .sort(function(p,q){return p.e.d<q.e.d?-1:p.e.d>q.e.d?1:p.x-q.x})
  .forEach(function(it){var n=(it.e.name||"").trim()||"Без названия";if(!g[n]){g[n]=[];order.push(n)}g[n].push(it.e)});
 order.forEach(function(n){
  o.push(n+":");
  g[n].forEach(function(e){var cs=codeStr(e.c);o.push(parseInt(e.d.split("-")[2],10)+". "+cs+(cs?" ":"")+num(e.a))});
  o.push("")});
 S.trips.forEach(function(t){
  o.push((t.city||"Командировка")+":");
  var sd=num(t.pd)*num(t.days);
  o.push((t.dates?t.dates+"   ":"")+num(t.a)+"₽"+(sd?" +"+sd+" суточные("+num(t.days)+" дн.)":""));o.push("")});
 o.push("Зп "+dd(S.from,1)+" – "+dd(S.to,1)+":");
 o.push("Работа: "+T.w);o.push("Расходы: "+T.x);o.push("Долг: "+T.d);o.push("Итого: "+T.t+" ты мне должен.");
 return o.join("\n")}

/* ---- события ---- */
function setPath(path,v){var p=path.split("."),o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v}
document.addEventListener("input",function(ev){
 var p=ev.target.getAttribute("data-p");if(!p)return;
 setPath(p,ev.target.value);
 var m=p.match(/^days\.(\d+)\.a$/);if(m){var r=S.days[m[1]];r.m=num(ev.target.value)!==auto(r)}
 calc()});
document.addEventListener("change",function(ev){var p=ev.target.getAttribute("data-p");if(p&&/^days\.\d+\.name$/.test(p))addHist(ev.target.value)});
$("sheet").addEventListener("click",function(ev){if(ev.target===$("sheet"))closeBtn()});
document.addEventListener("click",function(ev){
 var b=ev.target.closest("[data-a]");if(!b)return;
 var a=b.dataset.a,i=+b.dataset.i;
 if(a==="openDay"){openDay(b.dataset.d);return}
 if(a==="close"){closeBtn();return}
 if(a==="addEntry"){S.days.push({d:cur,name:lastName(cur),c:[],a:"",e:"",m:false});renderSheet();return}
 if(a==="delEntry"){S.days.splice(i,1);renderSheet();calc();return}
 if(a==="chip"){var e=S.days[i],c=e.c,x=c.indexOf(b.dataset.k);if(x>-1)c.splice(x,1);else c.push(b.dataset.k);if(!e.m)e.a=c.length?String(auto(e)):"";renderSheet();calc();return}
 if(a==="addTrip"){S.trips.push({city:"",dates:"",a:"",pd:"",days:""});renderTrips()}
 else if(a==="delTrip"){S.trips.splice(i,1);renderTrips()}
 else if(a==="addExp"){S.exps.push({d:"",t:"",a:""});renderExps()}
 else if(a==="delExp"){S.exps.splice(i,1);renderExps()}
 else if(a==="copy"){copyText(report());return}
 else if(a==="export"){exportData();return}
 else if(a==="import"){$("imp").click();return}
 else if(a==="reset"){if(confirm("Очистить всё и начать новый период?")){S=fresh();$("ok").textContent="";renderAll();return}else return}
 calc()});

function exportData(){
 var ok=$("ok");
 try{
  var blob=new Blob([JSON.stringify({v:2,state:S,names:hist()})],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="zp-backup-"+iso()+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  ok.textContent="Копия сохранена в «Загрузки» (zp-backup-"+iso()+".json)";
 }catch(e){ok.textContent="Не удалось сохранить файл"}}
$("imp").addEventListener("change",function(ev){
 var f=ev.target.files[0],ok=$("ok");if(!f)return;
 var r=new FileReader();
 r.onload=function(){try{
  var d=JSON.parse(r.result);if(!d.state||!(d.state.days||d.state.events))throw 0;
  if(!confirm("Заменить текущие данные данными из файла?"))return;
  S=fix(d.state);
  try{localStorage.setItem("zp_names",JSON.stringify(d.names||[]))}catch(e){}
  renderAll();fillList();ok.textContent="Данные восстановлены";
 }catch(e){ok.textContent="Это не файл копии приложения"}ev.target.value=""};
 r.readAsText(f)});
function copyText(t){
 var ok=$("ok");
 function fb(){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var r=false;try{r=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);ok.textContent=r?"Отчёт скопирован":"Не удалось скопировать — откройте «Текст отчёта» и выделите вручную"}
 try{navigator.clipboard.writeText(t).then(function(){ok.textContent="Отчёт скопирован"},fb)}catch(e){fb()}}

function renderAll(){
 document.querySelector('[data-p="from"]').value=S.from;
 document.querySelector('[data-p="to"]').value=S.to;
 document.querySelector('[data-p="debt"]').value=S.debt;
 CODES.forEach(function(k){document.querySelector('[data-p="rates.'+k+'"]').value=S.rates[k]});
 renderTrips();renderExps();calc()}

S=load();renderAll();fillList();
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
